<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyber Tic-Tac-Toe Pro</title>
  <link rel="stylesheet" href="style.css">
  <!-- Confetti library for win celebration -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
  <div class="app-wrapper">
    <header class="game-header">
      <h1 class="glitch-title">TIC TAC TOE</h1>
      <div class="mode-selector">
        <button class="mode-btn active" data-mode="pvp">2 Players</button>
        <button class="mode-btn" data-mode="ai-easy">AI (Easy)</button>
        <button class="mode-btn" data-mode="ai-hard">AI (Master)</button>
      </div>
    </header>

    <div class="scoreboard">
      <div class="score-card player-x-card active-turn" id="card-x">
        <span class="label">PLAYER X</span>
        <span class="score" id="score-x">0</span>
      </div>
      <div class="score-card tie-card">
        <span class="label">DRAWS</span>
        <span class="score" id="score-ties">0</span>
      </div>
      <div class="score-card player-o-card" id="card-o">
        <span class="label" id="o-label">PLAYER O</span>
        <span class="score" id="score-o">0</span>
      </div>
    </div>

    <div class="status-banner" id="status">Turn: Player X</div>

    <div class="board-container">
      <div class="board" id="board">
        <button class="cell" data-index="0"></button>
        <button class="cell" data-index="1"></button>
        <button class="cell" data-index="2"></button>
        <button class="cell" data-index="3"></button>
        <button class="cell" data-index="4"></button>
        <button class="cell" data-index="5"></button>
        <button class="cell" data-index="6"></button>
        <button class="cell" data-index="7"></button>
        <button class="cell" data-index="8"></button>
        <div class="strike-line" id="strike-line"></div>
      </div>
    </div>

    <div class="controls">
      <button class="control-btn" id="btn-restart">Restart Match</button>
      <button class="control-btn outline" id="btn-reset-score">Reset Scores</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
